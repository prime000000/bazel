syntax = "proto3";

package tools.protos;

option java_package = "com.google.devtools.build.lib.remote.prunedinputs";
option java_multiple_files = true;

message PrunedInputsManifest {
  message Candidate {
    repeated string used_paths = 1;
    string pruned_action_hash = 2;
    int64 pruned_action_size_bytes = 3;
  }

  repeated Candidate candidates = 1;
}
